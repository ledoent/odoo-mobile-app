# OCA-style hooks scoped to the Odoo addon half of the monorepo.
# The Flutter app is checked by `dart format` / `flutter analyze` in CI.
files: ^odoo/
exclude: |
  (?x)
  /static/description/index\.html$|
  \.pot?$|
  /README\.rst$
default_language_version:
  python: python3
repos:
  - repo: https://github.com/oca/maintainer-tools
    rev: b89f767503be6ab2b11e4f50a7557cb20066e667
    hooks:
      - id: oca-gen-addon-readme
        args:
          - --addons-dir=odoo/addons
          - --branch=main
          - --org-name=ledoent
          - --repo-name=odoo-mobile-app
          - --if-source-changed
          - --keep-source-digest
          - --convert-fragments-to-markdown
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.0.33
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
        args:
          - --disable=po-pretty-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: /README\.rst$|\.pot?$
      - id: end-of-file-fixer
        exclude: /README\.rst$|\.pot?$
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
